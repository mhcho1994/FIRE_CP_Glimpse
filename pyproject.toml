[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-glimpse"
version = "0.2.0"
description = "CP Glimpse: Multi-backend Modelica simulation framework (FMU)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Minhyun Cho" }
]

dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "OMPython",
    "FMPy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "jupyterlab",
    "notebook",
    "scipy",
    "casadi",
]

# CLI entry point
[project.scripts]
cp-glimpse = "cp_glimpse_py.main:main"

# --- setuptools config for src/ layout ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
