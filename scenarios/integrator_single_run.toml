[sim]
experiment = "single"
composition = "auto"
backend = "fmu-fmpy"
fmu_type = "cs"
t0 = 0.0
tf = 5.0
dt = 0.01
tol = 1.0e-6

[system]
components = [
  { name = "simple_integrator", class_name = "SimpleIntegrator", model_path = "models/benchmarks/SimpleIntegrator.mo" },
]

connections = []

[initialization]

[inputs.constant]
u = 1.0

[parameters]

[disturbances]

[outputs]
log = ["y"]
save_csv = true
out_dir = "results/runs"
run_name = "simple_integrator"
